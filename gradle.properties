# Gradle 运行参数
# 本机 Java 走 https 时需要读取 Windows 证书库（否则下载依赖会报 PKIX path building failed）
org.gradle.jvmargs=-Xmx3G -Djavax.net.ssl.trustStoreType=WINDOWS-ROOT
org.gradle.daemon=false
# Forge 1.20.1 的官方工具链需要 Java 17；本机默认是 JDK 21，所以显式指向便携 JDK 17。
# clone 之后请把下面这行改成你自己的 JDK 17 路径（不填则用系统默认 JDK，可能不是 17 而构建失败）
# org.gradle.java.home=C:/path/to/your/jdk-17
# ForgeGradle 每次应用插件时都会去连 maven.minecraftforge.net / libraries.minecraft.net 做证书检查，
# 本机（国内网络）实测会阻塞数分钟；关掉这项纯联网自检后构建恢复正常速度，不影响任何构建产物
systemProp.net.minecraftforge.gradle.check.certs=false

# 平台版本
minecraft_version=1.20.1
forge_version=47.4.10
curios_version=5.14.1+1.20.1

# 模组自身信息
# 注意：Forge 的 modId 不允许连字符，所以 modId 用下划线；而注册表/资源命名空间仍是 summy-reliquary
mod_id=summy_reliquary
mod_version=1.8.4-forge
maven_group=com.summy.reliquary
archives_base_name=summy-reliquary
