description='''
以 Curios 为前置的七罪主题饰品合集（Forge 1.20.1）。
· 天使线：肉体 / 思想 / 灵魂（灵台三件套）、伯列恒之星、终末天启、神性、救恩、圣光、神圣斗篷、圣心
· 恶魔线：契约、仪式法袍、撒旦圣经、咒印、复仇之魂、夜之幽魂、硫磺火、玄秘魔眼、深渊领主、亚巴顿、恶魔王冠
· 武器：献祭匕首与暗仪刺刀（遁入暗影）、圣光短矛与炽天使之枪（投掷 · 圣光爆发）、金刀片（穿透投掷）
· 七罪激活与赎罪、启示与创世纪、24 个成就
· 粉丝二创：灵感与部分素材取自《以撒的结合》（The Binding of Isaac），非官方作品，与原作者及权利方无关联
'''

