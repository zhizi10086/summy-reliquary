// Summy Reliquary 1.20.1：Forge + Curios 版本
// 说明：本工程由原来的 Fabric/Trinkets 版本原地改造而来，现在只产出 Forge jar；
//      在 Fabric 整合包里通过 Kilt（+ Fabric Language Kotlin）运行同一个 jar。
buildscript {
    repositories {
        // 本地 Maven 仓库：内含 org.spongepowered:mixin:0.8.5（含注解处理器），
        // 避免 MixinGradle 去 CreeperHost 回源被墙的 Sponge 站导致构建卡死。
        maven { url = uri("${projectDir}/libs-m2") }
        // MixinGradle 只能从 CreeperHost 镜像取（repo.spongepowered.org 本机不可达）
        maven { name = 'CreeperHost'; url = 'https://maven.creeperhost.net/' }
        mavenCentral()
        maven { name = 'MinecraftForge'; url = 'https://maven.minecraftforge.net/' }
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7.38'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    // Forge 1.20.1 官方工具链（与 Curios 自身使用的版本区间一致）
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

// 1.8.8：长矛动画专用 Mixin（全工程仅此一组允许使用）
apply plugin: 'org.spongepowered.mixin'

version = project.mod_version
group = project.maven_group

// 启动问题诊断开关（仅排查用，三选一）：
//   -Pnodata  去掉本轮新增的全部数据包内容（自定义伤害类型 + 3 个原版伤害类型标签覆盖）
//   -Pnotags  只去掉 3 个原版伤害类型标签覆盖（保留自定义伤害类型）
//   -Pnomodel 去掉新物品「终末天启」的模型与贴图
def diagnosisSwitch = ['nodata', 'notags', 'nomodel'].find { project.hasProperty(it) }

base {
    archivesName = project.archives_base_name
}

java {
    toolchain {
        // Forge 1.20.1 的目标是 Java 17；本机 JDK 通过 gradle.properties 的 org.gradle.java.home 指定
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
}

repositories {
    maven { url = uri("${projectDir}/libs-m2") }
    mavenCentral()
    // Forge 与 Curios 的发布仓库
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
    }
    // JEI：仅编译期（按玩家隐藏「赎罪」配方）；运行期没装 JEI 时相关类不会被加载
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
}

// JarJar 只接受 Maven 范围格式；把动态版本缓存拉到 365 天，解析完全走本地缓存。
configurations.all {
    resolutionStrategy {
        cacheDynamicVersionsFor 365, 'days'
        cacheChangingModulesFor 365, 'days'
    }
}

minecraft {
    // 使用 Mojang 官方映射（Curios 也是这套），保证 Curios API 的类/方法名可以直接引用
    mappings channel: 'official', version: project.minecraft_version

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            // 开发环境里让 Mixin 把依赖模组（Curios）自带的 SRG refmap 重映射成开发映射，
            // 否则 Curios 的 mixin 会因为找不到 f_xxx_ 字段而崩溃
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            // 只有显式加 -Pdevcheck 时才打开自检脚本（跑完会自动退出游戏）
            if (project.hasProperty('devcheck')) {
                property 'summy.devcheck', 'true'
            }
            mods {
                "${project.mod_id}" {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${project.mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    // AP 生成 refmap，并在 dev 运行参数 / jar manifest 里注册配置
    add sourceSets.main, 'summy-reliquary.refmap.json'
    config 'summy_reliquary.mixins.json'
}

// ForgeGradle 的 jarJar 默认关闭：显式打开，MixinExtras 才会作为嵌套 jar 打进产物
jarJar {
    enable()
}

// 正式包不带开发自检脚本（jarJar 从 classes 重新组装，不会继承 jar 的 exclude）
tasks.named('jarJar') {
    if (!project.hasProperty('devcheck')) {
        exclude 'com/summy/reliquary/devcheck/**'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"

    // Mixin 注解处理器：Forge 自带运行期 Mixin，这里只需要编译期
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    annotationProcessor 'org.ow2.asm:asm:9.5'
    annotationProcessor 'org.ow2.asm:asm-tree:9.5'
    annotationProcessor 'org.ow2.asm:asm-commons:9.5'
    annotationProcessor 'org.ow2.asm:asm-util:9.5'
    annotationProcessor 'org.ow2.asm:asm-analysis:9.5'
    annotationProcessor 'com.google.code.gson:gson:2.10.1'
    annotationProcessor 'com.google.guava:guava:31.1-jre'

    // MixinExtras：@WrapOperation / @Local / @Share 等注入器（jar-in-jar 打进产物）
    compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.5.5'))
    implementation(jarJar(group: 'io.github.llamalad7', name: 'mixinextras-forge', version: '[0.5.5]'))

    // Curios：本模组唯一的硬前置（饰品系统与栏位面板都由它提供）
    implementation fg.deobf("top.theillusivec4.curios:curios-forge:${project.curios_version}")

    // JEI API：compileOnly，不写进 mods.toml，也不打包
    compileOnly "mezz.jei:jei-1.20.1-forge-api:15.59.0.212"
}

// 把 gradle.properties 里的版本号写进 mods.toml
processResources {
    inputs.property 'version', project.mod_version
    inputs.property 'curios_version', project.curios_version

    filesMatching('META-INF/mods.toml') {
        expand(
                'version': project.mod_version,
                'curios_version': project.curios_version
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.encoding = 'UTF-8'
}

jar {
    // 开发自检脚本不打进正式 jar；需要测试时用 -Pdevcheck 打包
    if (!project.hasProperty('devcheck')) {
        exclude 'com/summy/reliquary/devcheck/**'
    }
    if (diagnosisSwitch == 'nodata' || diagnosisSwitch == 'notags') {
        exclude 'data/minecraft/tags/damage_type/**'
    }
    if (diagnosisSwitch == 'nodata') {
        exclude 'data/summy-reliquary/damage_type/**'
    }
    if (diagnosisSwitch == 'nomodel') {
        exclude 'assets/summy-reliquary/models/item/final_revelation.json'
        exclude 'assets/summy-reliquary/textures/item/final_revelation.png'
    }
    manifest {
        attributes([
                'Specification-Title'     : project.archives_base_name,
                'Specification-Vendor'    : 'Summy',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.mod_version,
                'Implementation-Vendor'   : 'Summy'
        ])
    }
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// 从主协调树或版本 worktree 向上查找工作区 JAR 根，再按 Minecraft 版本归档。
def resolveJarArchive = { String moduleDirectory ->
    File cursor = projectDir
    while (cursor != null && !new File(cursor, 'JAR').isDirectory()) {
        cursor = cursor.parentFile
    }
    if (cursor == null) {
        throw new GradleException('找不到工作区 JAR 归档目录')
    }
    return new File(cursor, "JAR/${project.minecraft_version}/${moduleDirectory}")
}

// 构建结束后把 reobf 后的 jar 复制到 JAR/<Minecraft版本>/summy-reliquary
tasks.named('build') {
    doLast {
        // 带诊断开关时：改名 + 放进 _test 子目录，避免覆盖正式产物
        def archiveDir = resolveJarArchive('summy-reliquary')
        def releaseDir = diagnosisSwitch ? new File(archiveDir, '_test') : archiveDir
        releaseDir.mkdirs()
        // 开启 JarJar 后，真正可发布的产物是 reobfJarJar（含嵌套的 MixinExtras）；
        // 没有该任务时才退回 reobfJar。ForgeGradle 6 的任务没有 archiveFile 属性，
        // 优先取 output 属性，取不到再退回约定目录。
        def reobfTask = tasks.findByName('reobfJarJar') ?: tasks.named('reobfJar').get()
        def jarFile = null
        if (reobfTask.hasProperty('output')) {
            def output = reobfTask.property('output')
            if (output instanceof File) {
                jarFile = output
            }
        }
        if (jarFile == null) {
            jarFile = (file('build/reobfJarJar').listFiles() ?: file('build/reobfJar').listFiles())
                    ?.find { it.name.endsWith('.jar') }
        }
        if (jarFile == null || !jarFile.exists()) {
            throw new GradleException('找不到 reobfJar 的输出 jar')
        }
        def targetName = diagnosisSwitch
                ? "${project.archives_base_name}-${project.mod_version}-test-${diagnosisSwitch}.jar"
                : "${project.archives_base_name}-${project.mod_version}.jar"
        copy {
            from jarFile
            rename { targetName }
            into releaseDir
        }
    }
}
