// Summy Reliquary 1.21.1：NeoForge + Curios 版本
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = project.mod_version
group = project.maven_group
base {
    archivesName = project.archives_base_name
}

// 启动问题诊断开关：
//   -Pnodata  去掉全部新增数据包内容
//   -Pnotags  只去掉原版伤害类型标签覆盖
//   -Pnomodel 去掉终末天启模型与贴图
def diagnosisSwitch = ['nodata', 'notags', 'nomodel'].find { project.hasProperty(it) }

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

repositories {
    // Gate A 已验证的 1.21.1 官方元数据离线补充。
    def localMetadata = file('.gradle/se-local-maven')
    if (localMetadata.isDirectory()) {
        maven {
            name = 'SRMigrateLocalMaven'
            url = uri(localMetadata)
            metadataSources {
                gradleMetadata()
                mavenPom()
                artifact()
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'SRMigratePinned'
                    url = uri(localMetadata)
                    metadataSources {
                        mavenPom()
                        artifact()
                    }
                }
            }
            filter {
                includeVersion('com.google.guava', 'guava', '31.1-jre')
                includeVersion('org.apache.logging.log4j', 'log4j-core', '2.8.1')
                includeVersion('org.apache.logging.log4j', 'log4j-core', '2.22.1')
                includeVersion('com.google.code.gson', 'gson', '2.10')
                includeVersion('com.google.code.gson', 'gson', '2.10.1')
                includeVersion('com.mojang', 'logging', '1.1.1')
                includeVersion('org.checkerframework', 'checker-qual', '3.12.0')
                includeVersion('com.google.errorprone', 'error_prone_annotations', '2.11.0')
                includeVersion('com.google.j2objc', 'j2objc-annotations', '1.3')
                includeVersion('commons-io', 'commons-io', '2.11.0')
            }
        }
    }
    maven {
        name = 'NeoForgedForgeCDN'
        url = 'https://neoforged.forgecdn.net/releases'
    }
    maven {
        name = 'BMCLAPI'
        url = 'https://bmclapi2.bangbang93.com/maven'
    }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
    mavenCentral()
}

// 自动注入的旧官方源当前不可用，统一改由 ForgeCDN 与本地元数据解析。
repositories.configureEach { repo ->
    if (repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository
            && repo.url?.host in ['maven.neoforged.net', 'maven.minecraftforge.net']) {
        repo.content {
            excludeGroupByRegex '.*'
        }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run')
            if (project.hasProperty('devcheck')) {
                systemProperty 'summy.devcheck', 'true'
            }
        }
        server {
            server()
            gameDirectory = project.file('run')
            programArgument '--nogui'
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Curios 是 SR 的硬前置；MDG 直接读取 NeoForge 版本制品。
    implementation "top.theillusivec4.curios:curios-neoforge:${project.curios_version}"

    // JEI 仅在编译期引用，运行期由用户可选安装。
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${project.jei_version}"

    // NeoForge 运行期提供 MixinExtras，这里只补编译期注解。
    compileOnly 'io.github.llamalad7:mixinextras-common:0.5.5'
}

processResources {
    inputs.property 'version', project.mod_version
    inputs.property 'curios_version', project.curios_version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand(
                'version': project.mod_version,
                'curios_version': project.curios_version
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

jar {
    if (!project.hasProperty('devcheck')) {
        exclude 'com/summy/reliquary/devcheck/**'
    }
    if (diagnosisSwitch == 'nodata' || diagnosisSwitch == 'notags') {
        exclude 'data/minecraft/tags/damage_type/**'
    }
    if (diagnosisSwitch == 'nodata') {
        exclude 'data/summy-reliquary/damage_type/**'
    }
    if (diagnosisSwitch == 'nomodel') {
        exclude 'assets/summy-reliquary/models/item/final_revelation.json'
        exclude 'assets/summy-reliquary/textures/item/final_revelation.png'
    }
    manifest {
        attributes([
                'Specification-Title'     : project.archives_base_name,
                'Specification-Vendor'    : 'Summy',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.mod_version,
                'Implementation-Vendor'   : 'Summy'
        ])
    }
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// 从版本 worktree 向上查找统一 JAR 根，再按 Minecraft 版本归档。
def resolveJarArchive = { String moduleDirectory ->
    File cursor = projectDir
    while (cursor != null && !new File(cursor, 'JAR').isDirectory()) {
        cursor = cursor.parentFile
    }
    if (cursor == null) {
        throw new GradleException('找不到工作区 JAR 归档目录')
    }
    return new File(cursor, "JAR/${project.minecraft_version}/${moduleDirectory}")
}

tasks.named('build') {
    doLast {
        def archiveDir = resolveJarArchive('summy-reliquary')
        def releaseDir = diagnosisSwitch ? new File(archiveDir, '_test') : archiveDir
        releaseDir.mkdirs()
        def jarFile = tasks.named('jar').get().archiveFile.get().asFile
        if (!jarFile.exists()) {
            throw new GradleException('找不到 NeoForge JAR 输出')
        }
        def targetName = diagnosisSwitch
                ? "${project.archives_base_name}-${project.mod_version}-test-${diagnosisSwitch}.jar"
                : "${project.archives_base_name}-${project.mod_version}.jar"
        copy {
            from jarFile
            rename { targetName }
            into releaseDir
        }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
